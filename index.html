<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h1>
        <img src="icons/view-dashboard-variant.svg"
             alt=""
             width="60">
        <span>Dashboard</span>
      </h1>
      <nav class="main-nav">
        <a href="#">
          <img src="icons/home.svg"
               alt=""
               width="30">
          <span>Home</span>
        </a>
        <a href="#">
          <img src="icons/card-account-details.svg"
               alt=""
               width="30">
          <span>Profile</span>
        </a>
        <a href="#">
          <img src="icons/message-bulleted.svg"
               alt=""
               width="30">
          <span>Messages</span>
        </a>
        <a href="#">
          <img src="icons/history.svg"
               alt=""
               width="30">
          <span>History</span>
        </a>
        <a href="#">
          <img src="icons/note-multiple.svg"
               alt=""
               width="30">
          <span>Tasks</span>
        </a>
        <a href="#">
          <img src="icons/account-group.svg"
               alt=""
               width="30">
          <span>Communities</span>
        </a>
      </nav>
      <nav class="secondary-nav">
        <a href="#">
          <img src="icons/cog.svg"
               alt=""
               width="30">
          <span>Settings</span>
        </a>
        <a href="#">
          <img src="icons/help-circle.svg"
               alt=""
               width="30">
          <span>Support</span>
        </a>
        <a href="#">
          <img src="icons/shield-check.svg"
               alt=""
               width="30">
          <span>Privacy</span>
        </a>
      </nav>
    </aside>
    <header class="page-header">
      <div class="search-container">
        <img src="icons/magnify.svg"
             alt=""
             width="30">
        <input type="search">
      </div>
      <div class="profile-container">
        <img src="icons/bell-ring.svg"
             alt=""
             width="30">
        <img src="pics/profile-pic.jpeg"
             alt=""
             width="50">
        <p>Son Goten</p>
      </div>
      <div class="greeting-container">
        <img src="pics/profile-pic.jpeg"
             alt=""
             width="60">
        <div class="greeting">
          <p>Hello there,</p>
          <h2>Son Goten (@goten)</h2>
        </div>
      </div>
      <div class="btn-container">
        <button type="button">New</button>
        <button type="button">Upload</button>
        <button type="button">Share</button>
      </div>
    </header>
  </div>
</body>
</html>
